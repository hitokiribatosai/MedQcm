name: Disposable staging acceptance
on:
  push:
    branches: [codex/architecture-foundation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start
      - run: npx playwright install --with-deps chromium
      - run: node scripts/ops/run-integration.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: staging-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 3
      - run: supabase stop --no-backup
        if: always()
