name: MedQCM operations
on:
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [monitor, scan, backup]
        required: true
  schedule:
    - cron: "*/15 * * * *"
    - cron: "25 2 * * *"
permissions:
  contents: read
concurrency:
  group: operations-${{ github.event.inputs.task || github.event.schedule }}
  cancel-in-progress: false
jobs:
  monitor:
    if: vars.MEDQCM_OPERATIONS_ENABLED == 'true' && (github.event.inputs.task == 'monitor' || github.event.schedule == '*/15 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-operations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node scripts/ops/monitor.mjs
        env:
          MONITOR_URLS: ${{ vars.MEDQCM_MONITOR_URLS }}
  scan:
    if: vars.MEDQCM_OPERATIONS_ENABLED == 'true' && (github.event.inputs.task == 'scan' || github.event.schedule == '*/15 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-operations
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f ops/scanner.Dockerfile -t medqcm-scanner .
      - run: docker run --rm -e SUPABASE_URL -e SUPABASE_SERVICE_ROLE_KEY -e SCAN_BATCH_SIZE medqcm-scanner
        env:
          SUPABASE_URL: ${{ secrets.OPERATIONS_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.OPERATIONS_SERVICE_ROLE_KEY }}
          SCAN_BATCH_SIZE: "10"
  backup:
    if: vars.MEDQCM_OPERATIONS_ENABLED == 'true' && (github.event.inputs.task == 'backup' || github.event.schedule == '25 2 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-operations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci --ignore-scripts
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: node scripts/ops/backup.mjs create .backups/medqcm.enc
        env:
          SUPABASE_URL: ${{ secrets.OPERATIONS_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.OPERATIONS_SERVICE_ROLE_KEY }}
          BACKUP_DB_URL: ${{ secrets.BACKUP_DB_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: medqcm-encrypted-backup-${{ github.run_id }}
          path: .backups/medqcm.enc
          retention-days: 14
